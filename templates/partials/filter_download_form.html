<!-- Filter and Download Section (no Bootstrap JS dependency) -->
<style>
    #filter-controls-wrapper { position: relative; z-index: 50; }
    #filter-controls-wrapper .period-select {
        padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc;
        font-size: 14px; background: #fff; cursor: pointer;
    }
    #filter-controls-wrapper .period-form {
        display: none; align-items: center; gap: 10px; flex-wrap: wrap;
        background: #fff; padding: 10px 14px; border-radius: 8px;
        border: 1px solid #ddd; margin-bottom: 12px;
    }
    #filter-controls-wrapper .period-form.active { display: flex; }
    #filter-controls-wrapper .period-form input[type="date"],
    #filter-controls-wrapper .period-form input[type="week"],
    #filter-controls-wrapper .period-form input[type="month"],
    #filter-controls-wrapper .period-form input[type="number"] {
        padding: 6px 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px;
    }
    #filter-controls-wrapper .period-form button {
        padding: 6px 16px; font-weight: 600; color: #fff; background: #28a745;
        border: none; border-radius: 6px; cursor: pointer;
    }
</style>

<div id="filter-controls-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-2">
            <label for="periodSelect" class="fw-bold">Choose Filter:</label>
            <select id="periodSelect" class="period-select">
                <option value="">Today (default)</option>
                <option value="day">Day</option>
                <option value="week">Week</option>
                <option value="month">Month</option>
                <option value="year">Year</option>
                <option value="range">Custom range</option>
            </select>
        </div>
        <div>
            <button type="button" id="downloadBtn" class="btn btn-success">⬇️ Download CSV</button>
        </div>
    </div>

    <form id="dayform" class="period-form" data-period="day">
        <label for="day_date" class="fw-bold">Select day:</label>
        <input type="date" id="day_date" name="day" required>
        <button type="submit">Apply</button>
    </form>
    <form id="weekform" class="period-form" data-period="week">
        <label for="week_date" class="fw-bold">Select week:</label>
        <input type="week" id="week_date" name="week" required>
        <button type="submit">Apply</button>
    </form>
    <form id="monthform" class="period-form" data-period="month">
        <label for="month_date" class="fw-bold">Select month:</label>
        <input type="month" id="month_date" name="month" required>
        <button type="submit">Apply</button>
    </form>
    <form id="yearform" class="period-form" data-period="year">
        <label for="year_date" class="fw-bold">Select year:</label>
        <input type="number" id="year_date" name="year" min="2020" max="2100" step="1" required>
        <button type="submit">Apply</button>
    </form>
    <form id="rangeform" class="period-form" data-period="range">
        <label>Start Date: <input type="date" id="range_start" name="start_date" required></label>
        <label>End Date: <input type="date" id="range_end" name="end_date" required></label>
        <button type="submit">Apply</button>
    </form>
</div>

<script>
(function () {
    const select = document.getElementById('periodSelect');
    const forms = document.querySelectorAll('#filter-controls-wrapper .period-form');
    const params = new URLSearchParams(window.location.search);

    // Pre-select the period currently being displayed and fill its inputs
    const current = params.has('day') ? 'day' : params.has('week') ? 'week' :
                    params.has('month') ? 'month' : params.has('year') ? 'year' :
                    (params.has('start_date') && params.has('end_date')) ? 'range' : '';
    select.value = current;
    if (params.get('day')) document.getElementById('day_date').value = params.get('day');
    if (params.get('week')) document.getElementById('week_date').value = params.get('week');
    if (params.get('month')) document.getElementById('month_date').value = params.get('month');
    if (params.get('year')) document.getElementById('year_date').value = params.get('year');
    if (params.get('start_date')) document.getElementById('range_start').value = params.get('start_date');
    if (params.get('end_date')) document.getElementById('range_end').value = params.get('end_date');

    function showPeriod(value) {
        forms.forEach(f => f.classList.toggle('active', f.dataset.period === value));
    }
    select.addEventListener('change', function () {
        if (!this.value) { window.location.href = window.location.pathname; return; }
        showPeriod(this.value);
    });

    forms.forEach(form => form.addEventListener('submit', function (e) {
        e.preventDefault();
        const data = new FormData(form);
        if (form.dataset.period === 'range' && data.get('start_date') > data.get('end_date')) {
            alert('Start date must be on or before end date');
            return;
        }
        const overlay = document.getElementById('loading-overlay');
        if (overlay) overlay.classList.add('active');
        window.location.href = window.location.pathname + '?' + new URLSearchParams(data).toString();
    }));

    // Download exactly the period being displayed (day/week/month/year/range)
    document.getElementById('downloadBtn').addEventListener('click', function () {
        window.location.href = '/download-csv?' + new URLSearchParams(window.location.search).toString();
    });
})();
</script>
